<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>MEGAMANIA 8-bit — Shmup Espacial</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>
<div id="cabinet">
  <div id="top-hud">
    <div class="hud-left">SCORE<br><span id="score">000000</span></div>
    <div class="hud-center">HI<br><span id="hi">000000</span></div>
    <div class="hud-center">FASE<br><span id="level">1-1</span></div>
    <div class="hud-right">VIDAS<br><span id="lives">★★★</span></div>
  </div>

  <div id="canvas-wrap">
    <canvas id="game" width="240" height="320"></canvas>
    <div id="overlay">
      <h1 id="ov-title">MEGA<br>MANIA</h1>
      <p id="ov-sub">8-BIT SHMUP</p>
      <p id="ov-enemy">— HAMBÚRGUERES —</p>
      <p id="ov-info">← → / A D move<br>ESPAÇO atira<br><span class="touch-only">Arraste para mover • Auto-fire ligado</span></p>
      <button id="btn-start">▶ INICIAR</button>
      <p id="ov-score"></p>
    </div>
  </div>

  <div id="bottom-hud">
    <div id="energy-label">ENERGIA <span id="energy-num">100</span></div>
    <div id="energy-bar"><div id="energy-fill"></div></div>
  </div>

  <div id="touch-controls">
    <button id="btn-left" aria-label="Esquerda">◀</button>
    <button id="btn-fire" aria-label="Atirar">● FIRE</button>
    <button id="btn-right" aria-label="Direita">▶</button>
  </div>
  <p id="hint">Desktop: ← → + Espaço &nbsp;|&nbsp; Mobile: arraste ou use ◀ ▶ + FIRE</p>
</div>
<script src="game.js"></script>
</body>
</html>
